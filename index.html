<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Portofolio Ku</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .profile-card {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 350px;
            width: 90%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .avatar {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            border-radius: 50%;
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            color: white;
            box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4);
        }
        h1 {
            font-size: 22px;
            margin-bottom: 8px;
        }
        .role {
            color: #38bdf8;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        p {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            background: #38bdf8;
            color: #0f172a;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            transition: background 0.2s, transform 0.2s;
        }
        .btn:hover {
            background: #7dd3fc;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="avatar">W</div>
        <h1>Wanglin</h1>
        <div class="role">Web Developer Pemula</div>
        <p>Lagi semangat-semangatnya belajar coding, Git, dan deployment website mandiri!</p>
        <a href="https://github.com/rohall12" target="_blank" class="btn">Kunjungi GitHub</a>
    </div>

</body>
</html>
